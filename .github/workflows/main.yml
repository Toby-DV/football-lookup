name: NextJS-Demo-Site
on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: node:20
    steps:
      - uses: actions/checkout@v4

      - run: npm ci
      - run: npx --no-install next lint
      - run: npx --no-install next build
