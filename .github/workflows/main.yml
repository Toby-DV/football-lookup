name: NextJS-Demo-Site
on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: node:24
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - run: npm ci
      - run: npm run lint
      - run: npm run build
